<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Welke stad? – satellietspel</title>
<style>
:root{--green:#2fdc5f;--red:#c5001a;--lime:#b8ff1f;--ink:#161616;--grey:#ebebeb;--purple:#8b82f2;--line:#e6e6e6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#f3f3f3;font-family:Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
/* top bar */
#bar{display:flex;align-items:center;padding:8px 10px 6px 14px;gap:4px;flex:none}
#timer{font-size:19px;letter-spacing:1.5px;font-variant-numeric:tabular-nums;margin-right:4px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:8px}
.ib svg{width:24px;height:24px}
.ib:active{background:#f0f0f0}
#bPause{width:30px}
#bPause svg{width:20px;height:20px}
.sp{flex:1}
#bCal{background:var(--purple);color:#fff;width:46px}
#bCal:active{background:#766ce0}
#srow{display:flex;align-items:stretch;border-top:1px solid var(--line);margin:0 12px;flex:none;height:46px}
#sbox{flex:1;display:flex;align-items:center;gap:8px;padding-left:8px;min-width:0}
#sbox svg{width:19px;height:19px;color:#8a8a8a;flex:none}
#q{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:17px;background:transparent;color:var(--ink)}
#q::placeholder{color:#a9a9a9}
#q:disabled{opacity:.5}
.tb{padding:0 10px;font-size:15.5px;font-weight:500;border-left:1px solid var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tb.on{background:var(--lime)}
.tb.on span{text-decoration:underline}
.tb svg{width:14px;height:14px}
/* stage */
#stage{position:relative;flex:1;margin:0 12px 12px;overflow:hidden;min-height:0}
#map{position:absolute;inset:0;background:#10202b;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
#map.drag{cursor:grabbing}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.layer img{position:absolute;width:256px;height:256px;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
#mk{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #fff;background:#f08a24;box-shadow:0 0 0 1.5px #c9641a,0 1px 5px rgba(0,0,0,.5);pointer-events:none;display:none;z-index:3}
#attr{position:absolute;left:0;bottom:0;font-size:9px;color:#fff;background:rgba(0,0,0,.35);padding:1px 5px;z-index:3;pointer-events:none}
.cb{position:absolute;z-index:4;width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.cb:active{background:#e4e4e4}
.cb svg{width:24px;height:24px}
#pU{left:62px;bottom:98px}#pL{left:30px;bottom:54px}#pR{left:94px;bottom:54px}#pD{left:62px;bottom:10px}
#cC{right:26px;bottom:118px}#cP{right:26px;bottom:64px}#cM{right:26px;bottom:10px}
#tileWarn{position:absolute;left:10px;right:10px;top:10px;z-index:5;background:#fff;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.35;box-shadow:0 2px 10px rgba(0,0,0,.3);display:none}
#pauseOv{position:absolute;inset:0;z-index:8;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:20px;font-weight:600}
#doneBar{position:absolute;left:10px;right:10px;top:10px;z-index:5;display:none}
/* suggestions */
#sug{position:absolute;inset:0;z-index:9;background:#fff;display:none;flex-direction:column}
#sugList{flex:1;overflow:auto;padding:10px 12px}
.si{display:block;width:100%;text-align:left;padding:9px 14px 9px 34px;position:relative;border-radius:5px;margin-bottom:4px}
.si::before{content:"";position:absolute;left:16px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.si b{display:block;font-size:16.5px;font-weight:600}
.si small{display:block;font-size:14.5px;font-weight:600;margin-top:4px}
.si mark{background:#fff36b;color:inherit}
.si.sel{background:#4c4c4a;color:#fff}
.si.sel::before{background:#fff}
.si.sel mark{background:transparent;color:#fff}
#sugEmpty{flex:1;display:grid;place-items:center;color:#d9d9d9}
#sugEmpty svg{width:44px;height:44px}
#sugBtns{display:none;gap:10px;padding:10px 12px;align-items:center;flex:none}
#sugBtns button{flex:1;height:44px;font-weight:700;font-size:14.5px;border-radius:5px}
#bSel{background:var(--ink);color:#fff}
/* hints */
#hints{position:absolute;left:0;right:0;top:0;z-index:7;background:#fff;padding:12px 14px 14px;display:none;box-shadow:0 6px 14px rgba(0,0,0,.25)}
#hints h3{margin:0 0 8px;font-size:16px}
.hr{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--grey);border-radius:10px;margin-top:8px;font-size:15px;min-height:46px}
.hr span{flex:1}
.hr button{background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:7px 14px;border-radius:5px}
/* panels */
.panel{position:absolute;inset:0;z-index:10;background:#fff;display:none;flex-direction:column;padding:10px 12px 14px}
.panel.card{margin:0 12px 12px;top:0;box-shadow:0 0 0 1px #eee;border-radius:0 0 8px 8px}
.ph{display:flex;align-items:flex-start;padding:6px 20px 0}
.ph h2{flex:1;margin:0;font-size:29px;font-weight:700;line-height:1.2}
.ph .sub{font-size:17px;margin-top:8px}
.x{width:40px;height:40px;display:grid;place-items:center;margin-right:-6px}
.x svg{width:40px;height:40px}
.pbody{padding:0 20px;flex:1;overflow:auto;min-height:0}
.pfoot{padding:8px 8px 0}
.btn{display:block;width:100%;height:52px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;border-radius:5px}
.btn:active{opacity:.8}
.btn.sec{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
#rRound{font-size:17px;margin:10px 0 0}
#rBar{display:flex;align-items:center;gap:10px;margin-top:22px}
#rBar svg{width:28px;height:28px;flex:none}
#rTrack{flex:1;height:13px;border-radius:7px;background:var(--grey);overflow:hidden}
#rFill{height:100%;width:100%;border-radius:7px;background:var(--ink)}
#rDist{text-align:center;font-size:22px;font-weight:700;margin:20px 0 22px;font-variant-numeric:tabular-nums}
.pill{height:57px;border-radius:29px;background:var(--grey);margin-bottom:21px;display:flex;align-items:center;padding:0 16px;color:#fff;font-size:22px;transition:background .25s}
.pill span{flex:1;opacity:0;transition:opacity .25s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg{width:30px;height:30px;opacity:0;transition:opacity .25s;flex:none}
.pill.ok{background:var(--green)}.pill.no{background:var(--red)}
.pill.ok span,.pill.no span,.pill.ok svg,.pill.no svg{opacity:1}
#rFinal{display:none;padding:0 20px;text-align:center}
#rLabel{font-size:14px;color:#666;margin-bottom:6px}
#rAns{height:46px;border-radius:23px;background:var(--lime);display:grid;place-items:center;font-size:19px;padding:0 14px}
#rNext{font-size:16.5px;margin:12px 0 4px}
#rNext b{margin-left:10px;font-variant-numeric:tabular-nums}
/* attempts */
.att{position:relative;background:var(--grey);border-radius:14px;min-height:92px;margin-top:16px;padding:14px 16px}
.att i{position:absolute;right:0;bottom:0;background:#fff;width:38px;height:30px;border-radius:10px 0 0 0;display:grid;place-items:center;font-style:normal;font-size:16px}
.att b{font-size:18px}.att div{font-size:14.5px;margin-top:5px}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;color:#fff;font-size:13px;margin-right:6px}
.tag.ok{background:var(--green)}.tag.no{background:var(--red)}
/* generic modal content */
.pbody p{font-size:16px;line-height:1.5;margin:12px 0}
.pbody li{font-size:16px;line-height:1.5;margin:6px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0;text-align:center}
.grid4 b{display:block;font-size:30px}
.grid4 span{font-size:12.5px;color:#555}
.dr{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:15px}
.dr em{width:66px;font-style:normal;white-space:nowrap;flex:none}
.dr div{background:var(--ink);color:#fff;height:26px;border-radius:5px;min-width:26px;text-align:right;padding:4px 8px;font-size:13.5px;font-weight:700}
.dr div.hl{background:var(--green)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.seg{display:flex;background:var(--grey);border-radius:8px;padding:3px}
.seg button{padding:7px 14px;border-radius:6px;font-size:14.5px;font-weight:600}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.day{display:flex;width:100%;align-items:center;text-align:left;padding:13px 14px;background:var(--grey);border-radius:10px;margin-top:8px;font-size:16px;gap:10px}
.day span{flex:1}.day small{font-size:13.5px;color:#555}
.day.cur{box-shadow:inset 0 0 0 2px var(--ink)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14.5px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#confetti{position:absolute;inset:0;z-index:20;pointer-events:none;width:100%;height:100%}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div id="timer">00:00</div>
    <button class="ib" id="bPause" aria-label="Pauze"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path id="pauseIc" d="M10 8.5v7M14 8.5v7" stroke-linecap="round"/></svg></button>
    <div class="sp"></div>
    <button class="ib" id="bInfo" aria-label="Uitleg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.1" fill="currentColor" stroke="none"/></svg></button>
    <button class="ib" id="bStats" aria-label="Statistieken"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="11" width="4.2" height="9" rx="1.5"/><rect x="9.9" y="6" width="4.2" height="14" rx="1.5"/><rect x="16.8" y="3" width="4.2" height="17" rx="1.5"/></svg></button>
    <button class="ib" id="bSet" aria-label="Instellingen"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M10.3 2h3.4l.6 2.7 1.5.6 2.3-1.5 2.4 2.4-1.500 2.300.6 1.500 2.700.600v3.400l-2.700.600-.600 1.500 1.500 2.300-2.400 2.400-2.300-1.500-1.500.600-.600 2.700h-3.400l-.600-2.700-1.500-.600-2.300 1.500-2.400-2.400 1.500-2.300-.600-1.500L2 13.700v-3.400l2.700-.600.600-1.500-1.500-2.300 2.400-2.400 2.300 1.500 1.500-.600zM12 8.300a3.700 3.700 0 1 0 0 7.400 3.700 3.700 0 0 0 0-7.400z" fill-rule="evenodd"/></svg></button>
    <button class="ib" id="bCal" aria-label="Eerdere dagen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9.500h16M8 3v3.500M16 3v3.500M8 13h.01M12 13h.01M16 13h.01M8 16.500h.01M12 16.500h.01M16 16.500h.01" stroke-linecap="round" stroke-width="2"/></svg></button>
  </div>
  <div id="srow">
    <label id="sbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.500" cy="10.500" r="7"/><path d="M16 16l5 5" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="typ de stad..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label>
    <button class="tb" id="bHints"><span>Hints</span></button>
    <button class="tb" id="bAtt"><span>Pogingen</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.600"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>

  <div id="stage">
    <div id="map"><div id="mk"></div><div id="attr">Beeld: Esri, Maxar, Earthstar Geographics</div></div>
    <button class="cb" id="pU" aria-label="Omhoog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
    <button class="cb" id="pL" aria-label="Links"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="cb" id="pR" aria-label="Rechts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="cb" id="pD" aria-label="Omlaag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="cb" id="cC" aria-label="Centreren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="12" cy="12" r="6.500"/><circle cx="12" cy="12" r="2.200" fill="currentColor"/><path d="M12 2v3.500M12 18.500V22M2 12h3.500M18.500 12H22"/></svg></button>
    <button class="cb" id="cP" aria-label="Inzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="cb" id="cM" aria-label="Uitzoomen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.300" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
    <div id="tileWarn">De satellietbeelden laden niet. Dit spel heeft een internetverbinding nodig en moet in een gewone browser geopend zijn.</div>
    <div id="doneBar"><button class="btn" id="bShowRes">Bekijk resultaat</button></div>
    <div id="hints"><h3>Hints</h3><div id="hintRows"></div></div>
    <div id="pauseOv"><div>Gepauzeerd</div><button class="btn" style="width:200px" id="bResume">Verder spelen</button></div>
    <div id="sug">
      <div id="sugEmpty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.800"><circle cx="10.500" cy="10.500" r="7"/><path d="M16 16l5 5" stroke-linecap="round"/></svg></div>
      <div id="sugList"></div>
      <div id="sugBtns"><button id="bClear">Clear</button><button id="bSel">Selecteer</button></div>
    </div>
  </div>

  <!-- resultaat -->
  <div class="panel card" id="pRes">
    <div class="ph"><div style="flex:1"><h2 id="rCity"></h2><div id="rRound"></div></div><button class="x" data-x aria-label="Sluiten"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="20" cy="20" r="14"/><path d="M15 15l10 10M25 15L15 25"/></svg></button></div>
    <div class="pbody">
      <div id="rBar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2.500V6M12 18v3.500M2.500 12H6M18 12h3.500"/></svg><div id="rTrack"><div id="rFill"></div></div></div>
      <div id="rDist"></div>
      <div class="pill" id="rCont"><span></span><svg viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="11"/><path/></svg></div>
      <div class="pill" id="rCtry"><span></span><svg viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="15" r="11"/><path/></svg></div>
    </div>
    <div id="rFinal"><div id="rLabel"></div><div id="rAns"></div><div id="rNext">Volgend spel in <b id="rCount">--:--:--</b></div></div>
    <div class="pfoot"><button class="btn" id="rBtn" style="visibility:hidden">Volgende Ronde</button></div>
  </div>

  <!-- pogingen -->
  <div class="panel card" id="pAtt">
    <div class="ph"><div style="flex:1"><h2 style="font-size:23px">Uw Pogingen</h2><div class="sub" style="font-size:19px">Bekijk Vorige Pogingen</div></div><button class="x" data-x><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="20" cy="20" r="14"/><path d="M15 15l10 10M25 15L15 25"/></svg></button></div>
    <div class="pbody" id="attBody"></div>
  </div>

  <!-- generiek -->
  <div class="panel card" id="pGen">
    <div class="ph"><h2 id="gTitle" style="font-size:25px;padding-top:6px"></h2><button class="x" data-x><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><circle cx="20" cy="20" r="14"/><path d="M15 15l10 10M25 15L15 25"/></svg></button></div>
    <div class="pbody" id="gBody"></div>
  </div>

  <canvas id="confetti"></canvas>
  <div id="toast"></div>
</div>

<script>

  if(ptrs.size===2&&pinch0){const q=[...ptrs.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y),r=map.getBoundingClientRect();
    const mx=(q[0].x+q[1].x)/2-r.left,my=(q[0].y+q[1].y)/2-r.top;
    if(d/pinch0>1.5){setZoom(Z+1,mx,my);pinch0=d}else if(d/pinch0<0.67){setZoom(Z-1,mx,my);pinch0=d}}});
const pup=e=>{ptrs.delete(e.pointerId);pinch0=0;if(!ptrs.size)map.classList.remove("drag")};
map.addEventListener("pointerup",pup);map.addEventListener("pointercancel",pup);
let wheelAcc=0;
map.addEventListener("wheel",e=>{e.preventDefault();wheelAcc+=e.deltaY;if(Math.abs(wheelAcc)>60){const r=map.getBoundingClientRect();setZoom(Z+(wheelAcc<0?1:-1),e.clientX-r.left,e.clientY-r.top);wheelAcc=0}},{passive:false});
window.addEventListener("resize",()=>{if(G)render()});

/* ---------- zoeken ---------- */
let selIdx=-1, shown=[];
function search(q){
  const n=norm(q); if(!n) return [];
  const a=[],b=[],c=[];
  for(let i=0;i<CITIES.length;i++){const ct=CITIES[i];
    const p1=ct.n1.indexOf(n), p2=ct.n2?ct.n2.indexOf(n):-1; if(p1<0&&p2<0) continue;
    if(p1===0||p2===0) a.push(i);
    else if((p1>0&&ct.n1[p1-1]===" ")||(p2>0&&ct.n2[p2-1]===" ")) b.push(i);
    else c.push(i);
    if(a.length>=8) break; // lijst is op inwonertal gesorteerd
  }
  return a.concat(b,c).slice(0,8);
}
const esc=s=>s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function hilite(name,q){
  const n=norm(q), low=name.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const raw=q.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
  if(low.length!==name.length) return esc(name);
  let p=low.indexOf(raw), len=raw.length; if(p<0){p=low.indexOf(n);len=n.length} if(p<0) return esc(name);
  return esc(name.slice(0,p))+"<mark>"+esc(name.slice(p,p+len))+"</mark>"+esc(name.slice(p+len));
}
function showSug(){
  const q=$("q").value; if(!q.trim()||G.done){hideSug();return}
  shown=search(q); if(!shown.includes(selIdx)) selIdx=-1;
  $("sug").style.display="flex";
  $("sugEmpty").style.display=shown.length?"none":"grid"; $("sugList").style.display=shown.length?"block":"none";
  $("sugList").innerHTML=shown.map(i=>{const c=CITIES[i];return '<button class="si'+(i===selIdx?" sel":"")+'" data-i="'+i+'"><b>'+hilite(c.name,q)+"</b><small>"+esc(c.country)+"</small></button>"}).join("");
  $("sugBtns").style.display=selIdx>=0?"flex":"none";
}
function hideSug(){ $("sug").style.display="none"; selIdx=-1 }
$("q").addEventListener("input",()=>{selIdx=-1;showSug()});
$("q").addEventListener("focus",()=>{$("hints").style.display="none";$("bHints").classList.remove("on");showSug()});
$("q").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault(); if(selIdx<0&&shown.length){selIdx=shown[0];showSug()} else if(selIdx>=0) doGuess(selIdx)}
  else if(e.key==="Escape"){$("q").value="";hideSug();$("q").blur()}
  else if((e.key==="ArrowDown"||e.key==="ArrowUp")&&shown.length){e.preventDefault();let p=shown.indexOf(selIdx);p=e.key==="ArrowDown"?Math.min(shown.length-1,p+1):Math.max(0,p-1);selIdx=shown[p];showSug()}
});
$("sugList").addEventListener("click",e=>{const b=e.target.closest(".si");if(!b)return;const i=+b.dataset.i;selIdx=selIdx===i?-1:i;$("q").blur();showSug()});
$("bClear").onclick=()=>{$("q").value="";hideSug()};
$("bSel").onclick=()=>{if(selIdx>=0)doGuess(selIdx)};

/* ---------- raden ---------- */
function doGuess(i){
  if(G.done) return;
  if(G.guesses.includes(i)){toast("Deze stad heb je al geprobeerd");return}
  G.guesses.push(i); const won=i===G.target;
  if(won||G.guesses.length>=ROUNDS){G.done=true;G.won=won;if(!G.practice)recordStats()}
  save(); $("q").value=""; $("q").blur(); hideSug(); updateUI();
  showResult(G.guesses.length-1,true);
}
function recordStats(){
  const s=store.get("stats",{played:0,won:0,streak:0,max:0,dist:[0,0,0,0,0],last:""});
  s.played++; if(G.won){s.won++;s.dist[G.guesses.length-1]++;
    const y=new Date();y.setDate(y.getDate()-1);
    if(G.key===todayKey()){s.streak=(s.last===dkey(y)||s.last===G.key)?s.streak+(s.last===G.key?0:1):1;s.last=G.key;s.max=Math.max(s.max,s.streak)}
  }else if(G.key===todayKey()){s.streak=0}
  store.set("stats",s);
}
const CHECK="M10 15.300l3.300 3.200 6.700-7", CROSS="M11 11l8 8M19 11l-8 8";
let resTimer=[], resAnim=null, resIdx=-1;
function showResult(gi,animate){
  resTimer.forEach(clearTimeout); resTimer=[]; cancelAnimationFrame(resAnim); resIdx=gi;
  const g=CITIES[G.guesses[gi]], t=T(), km=haversine(g,t), last=gi===G.guesses.length-1, fin=G.done&&last;
  $("rCity").textContent=g.name; $("rRound").textContent="Ronde "+(gi+1)+" / "+ROUNDS;
  const pc=$("rCont"), pl=$("rCtry"); pc.className="pill"; pl.className="pill";
  pc.firstElementChild.textContent=g.cont; pl.firstElementChild.textContent=g.country;
  pc.querySelector("path").setAttribute("d",g.cont===t.cont?CHECK:CROSS); pl.querySelector("path").setAttribute("d",g.cc===t.cc?CHECK:CROSS);
  $("rBtn").style.visibility="hidden"; $("rFinal").style.display="none";
  $("rBtn").textContent=fin?"Bekijk Statistieken":(last?"Volgende Ronde":"Sluiten");
  const fill=$("rFill"), dist=$("rDist"), target=Math.min(1,km/10000);
  const reveal=()=>{pc.classList.add(g.cont===t.cont?"ok":"no");};
  const reveal2=()=>{pl.classList.add(g.cc===t.cc?"ok":"no");};
  const end=()=>{$("rBtn").style.visibility="visible";
    if(fin){$("rFinal").style.display="block";$("rLabel").textContent=G.won?"":"Helaas! De stad was";$("rLabel").style.display=G.won?"none":"block";
      $("rAns").textContent=t.name+(G.won?"":" ("+t.country+")");
      $("rNext").style.display=G.practice?"none":"block"; tickCountdown();
      if(G.won&&animate&&settings.confetti) confetti()}};
  $("pRes").style.display="flex";
  if(!animate){fill.style.width=(target*100)+"%";dist.textContent=distTxt(km);reveal();reveal2();end();return}
  const from=km>9000?20000:10000, t0=performance.now(), dur=1700;
  const step=now=>{const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3), v=from+(km-from)*e;
    fill.style.width=(Math.min(1,v/10000)*100)+"%"; dist.textContent=distTxt(p<1?v:km);
    if(p<1) resAnim=requestAnimationFrame(step)};
  fill.style.width="100%"; dist.textContent=distTxt(from); resAnim=requestAnimationFrame(step);
  resTimer.push(setTimeout(reveal,dur+250),setTimeout(reveal2,dur+650),setTimeout(end,dur+1050));
}
$("rBtn").onclick=()=>{ if(G.done&&resIdx===G.guesses.length-1){openStats()} else closeResult() };
function closeResult(){ const wasLast=resIdx===G.guesses.length-1; $("pRes").style.display="none"; resTimer.forEach(clearTimeout);
  if(wasLast){ resetView(); } }
$("bShowRes").onclick=()=>showResult(G.guesses.length-1,false);

/* ---------- aftellen ---------- */
function tickCountdown(){ const el=$("rCount"); if(!el||$("pRes").style.display==="none") return;
  const n=new Date(), m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1), s=Math.max(0,Math.floor((m-n)/1000));
  el.textContent=pad(Math.floor(s/3600))+":"+pad(Math.floor(s/60)%60)+":"+pad(s%60); }

/* ---------- panelen ---------- */
function closePanels(){document.querySelectorAll(".panel").forEach(p=>p.style.display="none")}
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{const p=b.closest(".panel"); if(p.id==="pRes") closeResult(); else p.style.display="none"});
function openGen(title,html){ $("gTitle").textContent=title; $("gBody").innerHTML=html; $("pGen").style.display="flex"; }
$("bAtt").onclick=()=>{
  let h=""; const t=T();
  for(let i=0;i<ROUNDS;i++){ if(i<G.guesses.length){const g=CITIES[G.guesses[i]],km=haversine(g,t);
      h+='<div class="att" data-g="'+i+'"><b>'+esc(g.name)+"</b><div>"+distTxt(km)+'</div><div><span class="tag '+(g.cont===t.cont?"ok":"no")+'">'+esc(g.cont)+'</span><span class="tag '+(g.cc===t.cc?"ok":"no")+'">'+esc(g.country)+"</span></div><i>"+(i+1)+"</i></div>"}
    else h+='<div class="att"><i>'+(i+1)+"</i></div>"}
  $("attBody").innerHTML=h; $("pAtt").style.display="flex"; };
$("attBody").addEventListener("click",e=>{const a=e.target.closest("[data-g]");if(a){$("pAtt").style.display="none";showResult(+a.dataset.g,false)}});

/* hints */
function hintList(){const t=T(); const pop=t.pop>=1e6?(Math.round(t.pop/1e5)/10+"").replace(".",",")+" miljoen":fmt(Math.round(t.pop/1e4)*1e4);
  return [["Halfrond",(t.lat>=0?"Noordelijk":"Zuidelijk")+" halfrond, "+(t.lon>=0?"oostelijk":"westelijk")+" van Greenwich"],
          ["Inwoners","Ongeveer "+pop+" inwoners"+(t.cap?" – en het is een hoofdstad":" – geen hoofdstad")],
          ["Eerste letter","De naam begint met de letter "+t.name[0].toUpperCase()]]}
function renderHints(){const hs=hintList(); $("hintRows").innerHTML=hs.map((h,i)=>'<div class="hr"><span>'+(i<G.hints?"<b>"+h[0]+":</b> "+esc(h[1]):"Hint "+(i+1)+": "+h[0])+"</span>"+(i===G.hints&&!G.done?'<button data-h="'+i+'">Toon</button>':"")+"</div>").join("")}
$("bHints").onclick=()=>{const el=$("hints"),on=el.style.display!=="block"; hideSug(); el.style.display=on?"block":"none"; $("bHints").classList.toggle("on",on); if(on)renderHints()};
$("hintRows").addEventListener("click",e=>{if(e.target.dataset.h!=null){G.hints++;save();renderHints()}});

/* uitleg */
$("bInfo").onclick=()=>openGen("Hoe werkt het?",
  "<p>Je ziet een satellietbeeld van een stad ergens op aarde. Raad in <b>5 rondes</b> welke stad het is.</p><ul>"+
  "<li>Typ een stad, kies hem in de lijst en druk op <b>Selecteer</b>.</li>"+
  "<li>Na elke gok zie je hoe ver je ernaast zit en of <b>werelddeel</b> en <b>land</b> kloppen (groen = goed, rood = fout).</li>"+
  "<li>Elke ronde mag je verder uitzoomen. In de laatste rondes zie je een oranje stip op de plek van de stad.</li>"+
  "<li>Verschuif het beeld met de pijlen of door te slepen, zoom met + en −, en ga met het richtkruis terug naar het midden.</li>"+
  "<li>Elke dag is er één nieuwe stad. Via de kalender speel je eerdere dagen of een oefenspel.</li></ul>");
/* statistieken */
function openStats(){
  const s=store.get("stats",{played:0,won:0,streak:0,max:0,dist:[0,0,0,0,0]}), mx=Math.max(1,...s.dist);
  let h='<div class="grid4"><div><b>'+s.played+"</b><span>Gespeeld</span></div><div><b>"+(s.played?Math.round(100*s.won/s.played):0)+"</b><span>% gewonnen</span></div><div><b>"+s.streak+"</b><span>Huidige reeks</span></div><div><b>"+s.max+"</b><span>Langste reeks</span></div></div><p><b>Geraden in ronde</b></p>";
  s.dist.forEach((n,i)=>{h+='<div class="dr"><em>Ronde '+(i+1)+'</em><div class="'+(G.done&&G.won&&!G.practice&&G.guesses.length===i+1?"hl":"")+'" style="width:'+Math.max(8,70*n/mx)+'%">'+n+"</div></div>"});
  if(G.done){h+='<p style="margin-top:22px"><button class="btn" id="bShare">Kopieer resultaat</button></p><p><button class="btn sec" id="bPrac">Speel een oefenspel</button></p>'}
  openGen("Statistieken",h);
  const b=$("bShare"); if(b) b.onclick=()=>{const t=T();
    const txt="Welke stad? "+(G.practice?"(oefenspel)":G.key)+" – "+(G.won?G.guesses.length:"X")+"/"+ROUNDS+"\n"+G.guesses.map(i=>{const g=CITIES[i];return i===G.target?"🟩🟩 ✓":(g.cont===t.cont?"🟩":"🟥")+(g.cc===t.cc?"🟩":"🟥")+" "+fmt(haversine(g,t))+" km"}).join("\n");
    try{navigator.clipboard.writeText(txt).then(()=>toast("Gekopieerd"),()=>toast("Kopiëren lukte niet"))}catch(e){toast("Kopiëren lukte niet")}};
  const p=$("bPrac"); if(p) p.onclick=()=>newGame(todayKey(),true);
}
$("bStats").onclick=openStats;
/* instellingen */
function openSettings(){
  openGen("Instellingen",'<div class="row"><span>Afstand in</span><div class="seg" id="sUnit"><button data-v="km">km</button><button data-v="mi">mijl</button></div></div>'+
   '<div class="row"><span>Confetti bij winst</span><div class="seg" id="sConf"><button data-v="1">aan</button><button data-v="0">uit</button></div></div>'+
   '<p style="color:#666;font-size:14px">Je voortgang en statistieken worden alleen in deze browser bewaard.</p>');
  const mark=()=>{document.querySelectorAll("#sUnit button").forEach(b=>b.classList.toggle("on",b.dataset.v===settings.unit));
    document.querySelectorAll("#sConf button").forEach(b=>b.classList.toggle("on",(b.dataset.v==="1")===!!settings.confetti))}; mark();
  $("sUnit").onclick=e=>{if(e.target.dataset.v){settings.unit=e.target.dataset.v;store.set("settings",settings);mark()}};
  $("sConf").onclick=e=>{if(e.target.dataset.v){settings.confetti=e.target.dataset.v==="1";store.set("settings",settings);mark()}};
}
$("bSet").onclick=openSettings;
/* kalender */
$("bCal").onclick=()=>{
  const DN=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"], MN=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
  let h='<button class="day" data-p="1"><span><b>Oefenspel</b><br><small>Willekeurige stad, telt niet mee voor je statistieken</small></span></button><p style="margin:18px 0 0"><b>Dagpuzzels</b></p>';
  for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d),g=store.get("day:"+k,null);
    const st=!g?"Nog niet gespeeld":g.done?(g.won?"✓ Geraden in ronde "+g.guesses.length:"✗ Niet geraden"):"Bezig – "+g.guesses.length+" van "+ROUNDS+" pogingen";
    h+='<button class="day'+(!G.practice&&G.key===k?" cur":"")+'" data-k="'+k+'"><span>'+(i===0?"Vandaag":DN[d.getDay()]+" "+d.getDate()+" "+MN[d.getMonth()])+"<br><small>"+st+"</small></span></button>"}
  openGen("Kies een spel",h);
  $("gBody").onclick=e=>{const b=e.target.closest(".day");if(!b)return;$("gBody").onclick=null;save();if(b.dataset.p)newGame(todayKey(),true);else newGame(b.dataset.k,false)};
};

/* ---------- toast & confetti ---------- */
let toastT; function toast(m){const t=$("toast");t.textContent=m;t.style.opacity="1";clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity="0",1800)}
function confetti(){
  const c=$("confetti"),r=c.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);c.width=r.width*dpr;c.height=r.height*dpr;
  const x=c.getContext("2d");x.scale(dpr,dpr);
  const col=["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#f032e6","#ffe119","#46c8f0","#7a4a3a","#00a878","#ff4081"];
  const ps=[];for(let i=0;i<170;i++)ps.push({x:Math.random()*r.width,y:-20-Math.random()*r.height*.9,vx:(Math.random()-.5)*2.4,vy:2+Math.random()*3.500,
    w:4+Math.random()*10,h:3+Math.random()*12,rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,c:col[i%col.length],round:Math.random()<.25,ph:Math.random()*6.28});
  const t0=performance.now();
  (function f(now){const el=now-t0;x.clearRect(0,0,r.width,r.height);let alive=false;
    for(const p of ps){p.x+=p.vx+Math.sin(el/300+p.ph)*.8;p.y+=p.vy;p.rot+=p.vr;if(p.y<r.height+30)alive=true;
      x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;
      if(p.round){x.beginPath();x.ellipse(0,0,p.w*.7,p.w*.7*Math.abs(Math.cos(el/250+p.ph))+1,0,0,6.29);x.fill()}
      else x.fillRect(-p.w/2,-p.h/2*Math.cos(el/200+p.ph),p.w,p.h*Math.cos(el/200+p.ph));
      x.restore()}
    if(alive&&el<9000)requestAnimationFrame(f);else x.clearRect(0,0,r.width,r.height)})(t0);
}

/* ---------- start ---------- */
newGame(todayKey(),false);
if(!store.get("seen",false)){store.set("seen",true);$("bInfo").onclick()}
window.__dbg={get G(){return G},CITIES,doGuess,targetForDay};
</script>
